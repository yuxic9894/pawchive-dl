services:
  pawchive-dl:
    build: 
      context: .          
      dockerfile: Dockerfile
    image: pawchive-dl:latest
    container_name: pawchive-dl
    volumes:
      - ./downloads:/media
    # - ./appdata:/appdata # Uncomment to mount a local 'appdata' folder for passing cookies/batch files
    command:
      - --path
      - /media
      - "YOUR_URL"
