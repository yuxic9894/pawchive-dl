[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawchive-dl"
version = "2026.08.10"
description = "A simple downloader for Pawchive using Python."
authors = [
  { name="AlphaSlayer1964" }
]
dependencies = [
  "requests>=2.32.4"
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[tool.setuptools.packages.find]
include = ["pawchive_dl"]

[project.scripts]
pawchive-dl = "pawchive_dl.__main__:main"
